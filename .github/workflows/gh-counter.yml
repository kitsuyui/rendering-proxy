name: gh-counter
on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: gh-counter-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  pull-requests: write

jobs:
  gh-counter:
    uses: kitsuyui/gh-actions-workflows/.github/workflows/gh-counter.yml@be26297fad12a1c4664521df618fc3efcc6d7799
