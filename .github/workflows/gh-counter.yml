name: gh-counter
on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: gh-counter-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  pull-requests: write

jobs:
  gh-counter:
    uses: kitsuyui/gh-actions-workflows/.github/workflows/gh-counter.yml@3a3ec24ddcb7c3db65245357b7585392be01f65c
