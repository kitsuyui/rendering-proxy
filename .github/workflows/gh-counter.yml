name: gh-counter
on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: gh-counter-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  pull-requests: write

jobs:
  gh-counter:
    uses: kitsuyui/gh-actions-workflows/.github/workflows/gh-counter.yml@36728609c2c48e73b25172ed650de9437a0dfad8
